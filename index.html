<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike | Definitive Edition</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <style>
        body { margin: 0; background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace; color: white; touch-action: none; }
        #video-feed { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 1; opacity: 0.4; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 2; pointer-events: none; }
        
        .overlay { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 100; background: rgba(0,0,0,0.95); padding: 25px; 
            border: 2px solid #0f8; border-radius: 15px; text-align: center; width: 90%; max-width: 400px;
        }

        .hub-btn { background: #0f8; color: #000; padding: 15px; width: 100%; border: none; font-weight: bold; font-size: 18px; margin-top: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .hub-btn:disabled { background: #333; color: #888; cursor: not-allowed; }
        .hub-btn:active { transform: scale(0.98); }

        #ingame-ui { position: absolute; top: 10px; width: 100%; display: none; justify-content: center; align-items: center; gap: 20px; z-index: 60; }
        #timer { font-size: 32px; color: #f80; background: rgba(0,0,0,0.7); padding: 5px 20px; border-radius: 10px; border: 1px solid #f80; }
        
        .p-item { display: flex; justify-content: space-between; align-items: center; background: #222; margin: 5px 0; padding: 8px; border-radius: 5px; font-size: 13px; }
        .kick-btn { background: #f30; color: white; border: none; padding: 3px 10px; border-radius: 3px; cursor: pointer; }

        input { width: 85%; padding: 12px; background: #111; color: #0f8; border: 1px solid #0f8; text-align: center; border-radius: 5px; margin-bottom: 10px; font-family: inherit; }
        .team-box { display: flex; justify-content: space-between; margin: 15px 0; gap: 10px; }
        .team-list { width: 48%; border: 1px solid #333; min-height: 120px; background: #000; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="profile-gate" class="overlay">
        <h1 style="color:#0f8;">NEON STRIKE</h1>
        <p>CREATE YOUR IDENTITY</p>
        <input type="text" id="username-input" placeholder="DISPLAY NAME..." maxlength="12">
        <button class="hub-btn" onclick="saveProfile()">SAVE & CONTINUE</button>
    </div>

    <div id="menu" class="overlay" style="display:none">
        <h2 id="display-name" style="color:#0f8; margin:0;">PLAYER</h2>
        <p>Total Wins: <b id="win-display" style="color:#f80">0</b></p>
        <div id="cam-gate"><button class="hub-btn" onclick="initCam()">ALLOW CAMERA</button></div>
        <div id="hub-gate" style="display:none">
            <button class="hub-btn" onclick="openMode('1v1')">QUICK 1v1 DUEL</button>
            <button class="hub-btn" style="background:#444; color:white;" onclick="openMode('lobby')">CUSTOM ROOM</button>
            <p style="font-size:12px; opacity:0.6;">MY ID: <span id="my-id">----</span></p>
        </div>
    </div>

    <div id="lobby-gate" class="overlay" style="display:none">
        <h3 id="mode-title" style="margin:5px;">LOBBY</h3>
        <input type="number" id="join-id" placeholder="ENTER ID TO INVITE">
        <button onclick="connectPeer()" style="padding:10px; background:#08f; border:none; color:white; width:90%; font-weight:bold; border-radius:5px;">CONNECT PLAYER</button>
        
        <div class="team-box">
            <div class="team-list" id="list-blue"><b style="color:#08f">BLUE TEAM</b></div>
            <div class="team-list" id="list-red"><b style="color:#f30">RED TEAM</b></div>
        </div>

        <div style="display:flex; justify-content: space-around; margin-bottom: 10px;">
            <button onclick="switchTeam(1)" style="background:#08f; color:white; border:none; padding:10px; border-radius:5px; width:40%;">JOIN BLUE</button>
            <button onclick="switchTeam(2)" style="background:#f30; color:white; border:none; padding:10px; border-radius:5px; width:40%;">JOIN RED</button>
        </div>

        <button id="start-btn" class="hub-btn" onclick="startGame()">START MATCH</button>
        <button class="hub-btn" style="background:#222; color:white;" onclick="location.reload()">LEAVE ROOM</button>
    </div>

    <div id="ingame-ui">
        <div id="timer">READY</div>
        <button id="pause-btn" onclick="togglePauseRequest()" style="padding:10px; background:#fff; border:none; font-weight:bold; border-radius:5px;">PAUSE</button>
    </div>

    <div id="pause-overlay" class="overlay" style="display:none; border-color:#f80;">
        <h2 style="color:#f80;">GAME PAUSED</h2>
        <p id="pause-status">Waiting for all players to resume...</p>
        <button class="hub-btn" style="background:#f80" onclick="togglePauseRequest()">RESUME</button>
    </div>

    <video id="video-feed" playsinline autoplay muted></video>
    <canvas id="game-canvas"></canvas>

    <script type="module">
        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        let myName = "", myTeam = 1, myHP = 100, mode = 'lobby';
        let players = {}, conns = {}, isGaming = false, isHost = true;
        let myWins = parseInt(localStorage.getItem('neonWins')) || 0;
        
        let lastHitTime = 0;
        const HIT_COOLDOWN = 450;
        let myPauseRequest = false, isActuallyPaused = false;

        // Initialize Profile
        window.onload = () => {
            const savedName = localStorage.getItem('neonName');
            if(savedName) {
                myName = savedName;
                document.getElementById('profile-gate').style.display = 'none';
                document.getElementById('menu').style.display = 'block';
                document.getElementById('display-name').innerText = myName;
                document.getElementById('win-display').innerText = myWins;
            }
        };

        window.saveProfile = () => {
            const val = document.getElementById('username-input').value.trim();
            if(val.length < 2) return alert("Name too short!");
            myName = val;
            localStorage.setItem('neonName', myName);
            location.reload();
        };

        window.initCam = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            document.getElementById('cam-gate').style.display = 'none';
            document.getElementById('hub-gate').style.display = 'block';
            startAI();
        };

        const myId = Math.floor(1000 + Math.random() * 8999).toString();
        const peer = new Peer(myId);
        peer.on('open', id => document.getElementById('my-id').innerText = id);
        peer.on('connection', c => { isHost = true; handleConn(c); });

        window.openMode = (m) => {
            mode = m;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('lobby-gate').style.display = 'block';
            document.getElementById('mode-title').innerText = m === '1v1' ? "1v1 DUEL" : "CUSTOM MATCH";
            updateLobbyUI();
        };

        window.connectPeer = () => {
            isHost = false;
            const targetId = document.getElementById('join-id').value;
            if(targetId) handleConn(peer.connect(targetId));
        };

        function handleConn(c) {
            c.on('open', () => {
                conns[c.peer] = c;
                c.on('data', data => {
                    if(data.type === 'sync') { 
                        players[c.peer] = data; 
                        updateLobbyUI(); 
                        checkGlobalPause(); 
                        checkWinCondition(); 
                    }
                    if(data.type === 'hit' && data.target === myId && !isActuallyPaused) {
                        if (Date.now() - lastHitTime > HIT_COOLDOWN) {
                            myHP -= 5; if(myHP < 0) myHP = 0;
                        }
                    }
                    if(data.type === 'kick') { alert("Kicked by host."); location.reload(); }
                    if(data.type === 'start') {
                        isGaming = true;
                        document.getElementById('lobby-gate').style.display = 'none';
                        document.getElementById('ingame-ui').style.display = 'flex';
                    }
                });
            });
        }

        window.kickPlayer = (id) => {
            if(conns[id]) { conns[id].send({type: 'kick'}); delete players[id]; delete conns[id]; updateLobbyUI(); }
        };

        window.switchTeam = (t) => { myTeam = t; updateLobbyUI(); sync(); };

        function updateLobbyUI() {
            const b = document.getElementById('list-blue'), r = document.getElementById('list-red'), sBtn = document.getElementById('start-btn');
            b.innerHTML = '<b style="color:#08f">BLUE TEAM</b>';
            r.innerHTML = '<b style="color:#f30">RED TEAM</b>';
            
            const render = (id, team, pName, isMe) => {
                const d = document.createElement('div'); d.className = 'p-item';
                d.innerHTML = `<span>${isMe ? 'YOU' : pName}</span>`;
                if(isHost && !isMe) {
                    const k = document.createElement('button'); k.className = 'kick-btn'; k.innerText = 'KICK';
                    k.onclick = () => kickPlayer(id); d.appendChild(k);
                }
                (team === 1 ? b : r).appendChild(d);
            };

            render(myId, myTeam, myName, true);
            Object.keys(players).forEach(id => render(id, players[id].team, players[id].name, false));
            
            sBtn.innerText = isHost ? "START MATCH" : "WAITING FOR HOST...";
            sBtn.disabled = !isHost;
        }

        window.togglePauseRequest = () => {
            myPauseRequest = !myPauseRequest;
            document.getElementById('pause-btn').innerText = myPauseRequest ? "READY?" : "PAUSE";
            sync(); checkGlobalPause();
        };

        function checkGlobalPause() {
            let total = Object.keys(players).length + 1;
            let count = myPauseRequest ? 1 : 0;
            Object.values(players).forEach(p => { if(p.wantsPause) count++; });
            isActuallyPaused = (count === total);
            document.getElementById('pause-overlay').style.display = isActuallyPaused ? 'block' : 'none';
        }

        function checkWinCondition() {
            if(!isGaming) return;
            const teamsAlive = new Set();
            if(myHP > 0) teamsAlive.add(myTeam);
            Object.values(players).forEach(p => { if(p.hp > 0) teamsAlive.add(p.team); });

            if(teamsAlive.size === 1 && (Object.keys(players).length > 0)) {
                const winnerTeam = Array.from(teamsAlive)[0];
                isGaming = false;
                if(winnerTeam === myTeam) {
                    myWins++; localStorage.setItem('neonWins', myWins);
                    alert("VICTORY! YOUR TEAM WON.");
                } else { alert("DEFEAT! YOUR TEAM WAS WIPED."); }
                location.reload();
            }
        }

        window.startGame = () => {
            isGaming = true;
            document.getElementById('lobby-gate').style.display = 'none';
            document.getElementById('ingame-ui').style.display = 'flex';
            broadcast({type: 'start'});
        };

        const sync = (pos = []) => broadcast({type: 'sync', name: myName, team: myTeam, hp: myHP, pos, wantsPause: myPauseRequest, wins: myWins});
        function broadcast(d) { Object.values(conns).forEach(c => { if(c.open) c.send(d); }); }

        function startAI() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });
            hands.onResults(res => {
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                ctx.clearRect(0,0, canvas.width, canvas.height);
                let myPos = [];
                
                if(res.multiHandLandmarks && !isActuallyPaused) {
                    res.multiHandLandmarks.forEach(h => {
                        const x = h[0].x * canvas.width, y = h[0].y * canvas.height;
                        myPos.push({x, y});
                        if(isGaming && myHP > 0) {
                            drawWarrior(x, y, myTeam, myName, myHP);
                            Object.keys(players).forEach(id => {
                                const p = players[id];
                                if(p.team !== myTeam && p.hp > 0) {
                                    p.pos.forEach(ep => {
                                        if(Math.sqrt((x-ep.x)**2 + (y-ep.y)**2) < 65) {
                                            const now = Date.now();
                                            if (now - lastHitTime > HIT_COOLDOWN) {
                                                lastHitTime = now;
                                                broadcast({type: 'hit', target: id});
                                            }
                                        }
                                    });
                                }
                            });
                        }
                    });
                }

                if(isGaming || Object.keys(conns).length > 0) {
                    Object.keys(players).forEach(id => {
                        const p = players[id];
                        if(p.hp > 0) p.pos.forEach(pos => drawWarrior(pos.x, pos.y, p.team, p.name, p.hp));
                    });
                    sync(myPos);
                }
            });
            async function loop() { if(video.readyState >= 2) await hands.send({image: video}); requestAnimationFrame(loop); }
            loop();
        }

        function drawWarrior(x, y, team, name, hp) {
            const c = team === 1 ? "#08f" : "#f30";
            ctx.shadowBlur = 15; ctx.shadowColor = c;
            ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "white"; ctx.font = "bold 14px Courier"; ctx.textAlign = "center"; ctx.fillText(name.toUpperCase(), x, y-65);
            ctx.fillStyle = "#333"; ctx.fillRect(x-30, y-60, 60, 6);
            ctx.fillStyle = c; ctx.fillRect(x-30, y-60, 60 * (hp/100), 6);
        }
    </script>
</body>
</html>
