<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike | Sound & Identity</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <style>
        body { margin: 0; background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace; color: white; touch-action: none;}
        #video-feed { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 1; opacity: 0.4; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 2; pointer-events: none; }
        
        #menu, #profile-gate { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 100; background: rgba(0,0,0,0.95); padding: 25px; 
            border: 2px solid #0f8; border-radius: 15px; text-align: center; width: 90%; max-width: 400px;
        }

        .hub-btn { background: #0f8; color: #000; padding: 15px; width: 100%; border: none; font-weight: bold; font-size: 18px; margin-top: 10px; border-radius: 8px; cursor: pointer; }
        input { width: 85%; padding: 12px; background: #111; color: #0f8; border: 1px solid #0f8; text-align: center; border-radius: 5px; margin-bottom: 10px;}
        
        #ingame-ui { position: absolute; top: 10px; width: 100%; display: none; justify-content: center; align-items: center; z-index: 60; }
        #timer { font-size: 30px; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 8px; color: #f80; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="REPLACE_WITH_YOUR_MUSIC_FILE_URL" type="audio/mpeg">
    </audio>

    <div id="profile-gate">
        <h1 style="color:#0f8;">SET IDENTITY</h1>
        <input type="text" id="username-input" placeholder="DISPLAY NAME..." maxlength="12">
        <button class="hub-btn" onclick="saveProfile()">START ENGINE</button>
    </div>

    <div id="ingame-ui">
        <div id="timer">99</div>
    </div>

    <video id="video-feed" playsinline autoplay muted></video>
    <canvas id="game-canvas"></canvas>

    <div id="menu" style="display:none">
        <h1 style="color:#0f8; margin:0;">NEON STRIKE</h1>
        <p><span id="display-name" style="color:#0f8;">Player</span> | Wins: <b id="win-count">0</b></p>
        
        <div id="hub-gate">
            <button class="hub-btn" onclick="initCam()">INITIALIZE CAMERA</button>
            <div id="lobby-controls" style="display:none; margin-top:15px;">
                <input type="number" id="join-id" placeholder="ENTER PLAYER ID">
                <button onclick="connectPeer()" style="padding:10px; background:#08f; border:none; color:white; width:100%; border-radius:5px;">CONNECT</button>
                <div style="display:flex; justify-content:space-between; margin-top:10px;">
                    <button onclick="switchTeam(1)" style="background:#08f; width:48%; padding:10px; border:none;">TEAM BLUE</button>
                    <button onclick="switchTeam(2)" style="background:#f30; width:48%; padding:10px; border:none;">TEAM RED</button>
                </div>
                <button id="start-btn" class="hub-btn" onclick="startGame()">START MATCH</button>
            </div>
            <p>MY ID: <b id="my-id" style="color:#0f8">----</b></p>
        </div>
    </div>

    <script type="module">
        const video = document.getElementById('video-feed');
        const bgMusic = document.getElementById('bg-music');
        let myTeam = 1, myHP = 100, myName = "";
        let players = {}, conns = {}, isGaming = false, isHost = true;
        let myWins = parseInt(localStorage.getItem('neonWins')) || 0;

        // Profile & Music Loading
        window.onload = () => {
            const savedName = localStorage.getItem('neonName');
            if(savedName) {
                myName = savedName;
                document.getElementById('profile-gate').style.display = 'none';
                document.getElementById('menu').style.display = 'block';
                updateProfileUI();
            }
        };

        window.saveProfile = () => {
            const input = document.getElementById('username-input').value.trim();
            if(input.length < 2) return alert("Name too short!");
            myName = input;
            localStorage.setItem('neonName', myName);
            document.getElementById('profile-gate').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            updateProfileUI();
            // Start music on first interaction (browser requirement)
            bgMusic.play().catch(() => console.log("Music waiting for interaction"));
        };

        function updateProfileUI() {
            document.getElementById('display-name').innerText = myName;
            document.getElementById('win-count').innerText = myWins;
        }

        window.initCam = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            document.getElementById('lobby-controls').style.display = 'block';
            bgMusic.play(); // Ensure music plays
            startAI();
        };

        const myId = Math.floor(1000 + Math.random() * 8999).toString();
        const peer = new Peer(myId);
        peer.on('open', id => document.getElementById('my-id').innerText = id);
        peer.on('connection', c => { isHost = true; handleConn(c); });

        window.connectPeer = () => {
            isHost = false; 
            const targetId = document.getElementById('join-id').value;
            if(targetId) handleConn(peer.connect(targetId));
        };

        function handleConn(c) {
            c.on('open', () => {
                conns[c.peer] = c;
                c.on('data', data => {
                    if(data.type === 'sync') { players[c.peer] = data; checkWinCondition(); }
                    if(data.type === 'hit' && data.target === myId) { myHP -= 5; if(myHP <= 0) myHP = 0; }
                    if(data.type === 'start') {
                        isGaming = true;
                        document.getElementById('menu').style.display = 'none';
                        document.getElementById('ingame-ui').style.display = 'flex';
                    }
                });
            });
        }

        function checkWinCondition() {
            if(!isGaming) return;
            const teamsAlive = new Set();
            if(myHP > 0) teamsAlive.add(myTeam);
            Object.values(players).forEach(p => { if(p.hp > 0) teamsAlive.add(p.team); });
            if(teamsAlive.size === 1) {
                const winnerTeam = Array.from(teamsAlive)[0];
                isGaming = false;
                if(winnerTeam === myTeam) {
                    myWins++; localStorage.setItem('neonWins', myWins);
                    alert("VICTORY!");
                } else { alert("DEFEAT!"); }
                location.reload();
            }
        }

        window.startGame = () => {
            isGaming = true;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ingame-ui').style.display = 'flex';
            broadcast({type: 'start'});
        };

        const sync = (pos = []) => broadcast({type: 'sync', name: myName, team: myTeam, hp: myHP, pos: pos, wins: myWins});
        function broadcast(d) { Object.values(conns).forEach(c => { if(c.open) c.send(d); }); }

        const canvas = document.getElementById('game-canvas'), ctx = canvas.getContext('2d');

        function startAI() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });
            hands.onResults(res => {
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                ctx.clearRect(0,0, canvas.width, canvas.height);
                let myPos = [];
                if(res.multiHandLandmarks) {
                    res.multiHandLandmarks.forEach(h => {
                        const x = h[0].x * canvas.width, y = h[0].y * canvas.height;
                        myPos.push({x, y});
                        if(isGaming && myHP > 0) {
                            drawChar(x, y, myTeam, myName, myHP);
                            Object.keys(players).forEach(id => {
                                const p = players[id];
                                if(p.team !== myTeam && p.hp > 0) {
                                    p.pos.forEach(ep => {
                                        if(Math.sqrt((x-ep.x)**2 + (y-ep.y)**2) < 60) broadcast({type: 'hit', target: id});
                                    });
                                }
                            });
                        }
                    });
                }
                if(isGaming || Object.keys(conns).length > 0) {
                    Object.keys(players).forEach(id => {
                        const p = players[id];
                        if(p.hp > 0) p.pos.forEach(pos => drawChar(pos.x, pos.y, p.team, p.name, p.hp));
                    });
                    sync(myPos);
                }
            });
            async function loop() { if(video.readyState >= 2) await hands.send({image: video}); requestAnimationFrame(loop); }
            loop();
        }

        function drawChar(x, y, team, name, hp) {
            const c = team === 1 ? "#08f" : "#f30";
            ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.fillText(name, x, y-60);
            ctx.fillStyle = "#333"; ctx.fillRect(x-30, y-55, 60, 6);
            ctx.fillStyle = c; ctx.fillRect(x-30, y-55, 60 * (hp/100), 6);
        }
    </script>
</body>
</html>
