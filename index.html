<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike | Private Rooms</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <style>
        body { margin: 0; background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace; color: white; touch-action: none;}
        #video-feed { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 1; opacity: 0.4; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 2; pointer-events: none; }
        
        #menu, #profile-gate, #lobby-gate { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 100; background: rgba(0,0,0,0.95); padding: 25px; 
            border: 2px solid #0f8; border-radius: 15px; text-align: center; width: 90%; max-width: 400px;
        }

        .hub-btn { background: #0f8; color: #000; padding: 15px; width: 100%; border: none; font-weight: bold; font-size: 18px; margin-top: 10px; border-radius: 8px; cursor: pointer; }
        input { width: 85%; padding: 12px; background: #111; color: #0f8; border: 1px solid #0f8; text-align: center; border-radius: 5px; margin-bottom: 10px; font-weight: bold; }
        
        .p-item { display: flex; justify-content: space-between; align-items: center; background: #222; margin: 4px 0; padding: 8px; border-radius: 4px; font-size: 14px; }
        .kick-btn { background: #f30; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
        #ingame-ui { position: absolute; top: 10px; width: 100%; display: none; justify-content: center; z-index: 60; }
    </style>
</head>
<body>

    <div id="profile-gate">
        <h1 style="color:#0f8;">NEON STRIKE</h1>
        <input type="text" id="username-input" placeholder="YOUR NAME" maxlength="12">
        <button class="hub-btn" onclick="saveProfile()">CONTINUE</button>
    </div>

    <div id="menu" style="display:none">
        <h2 style="color:#0f8;" id="welcome-msg">WELCOME</h2>
        <button class="hub-btn" onclick="initCam()">INITIALIZE CAMERA</button>
        <div id="hub-options" style="display:none; margin-top:20px;">
            <input type="text" id="room-code-input" placeholder="ENTER ROOM CODE (e.g. 1234)">
            <button class="hub-btn" style="background:#08f; color:white;" onclick="handleRoomAction('create')">CREATE ROOM</button>
            <button class="hub-btn" style="background:#444; color:white;" onclick="handleRoomAction('join')">JOIN ROOM</button>
        </div>
    </div>

    <div id="lobby-gate" style="display:none">
        <h3 id="lobby-title" style="color:#0f8; margin:0;">LOBBY</h3>
        <div id="player-list" style="margin:15px 0; text-align:left;"></div>
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <button onclick="switchTeam(1)" style="background:#08f; width:48%; padding:10px; border:none; color:white;">TEAM BLUE</button>
            <button onclick="switchTeam(2)" style="background:#f30; width:48%; padding:10px; border:none; color:white;">TEAM RED</button>
        </div>
        <button id="start-btn" class="hub-btn" onclick="startGame()">START MATCH</button>
    </div>

    <div id="ingame-ui">
        <div id="timer" style="font-size:24px; background:rgba(0,0,0,0.6); padding:5px 20px; border-radius:8px; color:#f80;">READY</div>
    </div>

    <video id="video-feed" playsinline autoplay muted></video>
    <canvas id="game-canvas"></canvas>

    <script type="module">
        const video = document.getElementById('video-feed');
        let myTeam = 1, myHP = 100, myName = "", roomCode = "";
        let players = {}, conns = {}, isGaming = false, isHost = false;
        let peer;

        window.saveProfile = () => {
            const val = document.getElementById('username-input').value.trim();
            if(val.length < 2) return alert("Name too short!");
            myName = val;
            localStorage.setItem('neonName', myName);
            document.getElementById('profile-gate').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            document.getElementById('welcome-msg').innerText = "READY, " + myName;
        };

        window.initCam = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                document.getElementById('hub-options').style.display = 'block';
                startAI();
            } catch(e) { alert("Camera access required!"); }
        };

        window.handleRoomAction = (action) => {
            const code = document.getElementById('room-code-input').value.trim();
            if(code.length < 3) return alert("Code must be at least 3 chars!");
            roomCode = code;

            // Initialize Peer with the specific room code or a derivative of it
            // Peer IDs must be unique globally, so for "Create", we use the code. 
            // Note: In a real app, you'd use a server to mediate, but here we use the code as ID.
            if(action === 'create') {
                isHost = true;
                initPeer(roomCode);
            } else {
                isHost = false;
                initPeer(null); // Joiners get a random ID
                setTimeout(() => connectToHost(roomCode), 500);
            }
        };

        function initPeer(id) {
            peer = new Peer(id);
            peer.on('open', (pid) => {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('lobby-gate').style.display = 'block';
                document.getElementById('lobby-title').innerText = "ROOM: " + roomCode;
                updateLobbyUI();
            });
            peer.on('connection', handleConn);
            peer.on('error', (err) => {
                if(err.type === 'unavailable-id') alert("Room code already in use! Try Join or a new code.");
            });
        }

        function connectToHost(hostId) {
            handleConn(peer.connect(hostId));
        }

        function handleConn(c) {
            c.on('open', () => {
                conns[c.peer] = c;
                c.on('data', data => {
                    if(data.type === 'sync') { players[c.peer] = data; updateLobbyUI(); }
                    if(data.type === 'hit' && data.target === peer.id) { myHP -= 5; if(myHP <= 0) myHP = 0; }
                    if(data.type === 'kick') { alert("Kicked from room."); location.reload(); }
                    if(data.type === 'start') {
                        isGaming = true;
                        document.getElementById('lobby-gate').style.display = 'none';
                        document.getElementById('ingame-ui').style.display = 'flex';
                    }
                });
            });
        }

        window.switchTeam = (t) => { myTeam = t; sync(); updateLobbyUI(); };
        window.kickPlayer = (pid) => { if(conns[pid]) { conns[pid].send({type: 'kick'}); delete players[pid]; updateLobbyUI(); } };

        function updateLobbyUI() {
            const list = document.getElementById('player-list');
            const sBtn = document.getElementById('start-btn');
            list.innerHTML = "";
            
            const addRow = (name, team, pid, isMe) => {
                const div = document.createElement('div');
                div.className = 'p-item';
                div.style.borderLeft = team === 1 ? "5px solid #08f" : "5px solid #f30";
                div.innerHTML = `<span>${name} ${isMe ? '(YOU)' : ''}</span>`;
                if(isHost && !isMe) {
                    const kb = document.createElement('button');
                    kb.className = 'kick-btn'; kb.innerText = "KICK";
                    kb.onclick = () => kickPlayer(pid);
                    div.appendChild(kb);
                }
                list.appendChild(div);
            };

            addRow(myName, myTeam, peer.id, true);
            Object.keys(players).forEach(id => addRow(players[id].name, players[id].team, id, false));
            
            sBtn.innerText = isHost ? "START MATCH" : "WAITING FOR HOST...";
            sBtn.disabled = !isHost;
        }

        window.startGame = () => {
            isGaming = true;
            document.getElementById('lobby-gate').style.display = 'none';
            document.getElementById('ingame-ui').style.display = 'flex';
            broadcast({type: 'start'});
        };

        const sync = (pos = []) => broadcast({type: 'sync', name: myName, team: myTeam, hp: myHP, pos: pos});
        function broadcast(d) { Object.values(conns).forEach(c => { if(c.open) c.send(d); }); }

        const canvas = document.getElementById('game-canvas'), ctx = canvas.getContext('2d');

        function startAI() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });
            hands.onResults(res => {
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                ctx.clearRect(0,0, canvas.width, canvas.height);
                let myPos = [];
                if(res.multiHandLandmarks) {
                    res.multiHandLandmarks.forEach(h => {
                        const x = h[0].x * canvas.width, y = h[0].y * canvas.height;
                        myPos.push({x, y});
                        if(isGaming && myHP > 0) {
                            drawChar(x, y, myTeam, myName, myHP);
                            Object.keys(players).forEach(id => {
                                const p = players[id];
                                if(p.team !== myTeam && p.hp > 0) {
                                    p.pos.forEach(ep => {
                                        if(Math.sqrt((x-ep.x)**2 + (y-ep.y)**2) < 60) broadcast({type: 'hit', target: id});
                                    });
                                }
                            });
                        }
                    });
                }
                if(isGaming || (peer && peer.id)) {
                    Object.values(players).forEach(p => {
                        if(p.hp > 0) p.pos.forEach(pos => drawChar(pos.x, pos.y, p.team, p.name, p.hp));
                    });
                    sync(myPos);
                }
            });
            async function loop() { if(video.readyState >= 2) await hands.send({image: video}); requestAnimationFrame(loop); }
            loop();
        }

        function drawChar(x, y, team, name, hp) {
            const c = team === 1 ? "#08f" : "#f30";
            ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
            ctx.fillText(name, x, y-60);
            ctx.fillStyle = "#333"; ctx.fillRect(x-30, y-55, 60, 6);
            ctx.fillStyle = c; ctx.fillRect(x-30, y-55, 60 * (hp/100), 6);
        }
    </script>
</body>
</html>
