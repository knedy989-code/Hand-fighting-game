<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hand Fight | Direct Camera Fix</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; color: white; touch-action: none;}
        
        /* The video and canvas are now separated. Video is always visible! */
        #video-feed { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 1; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 2; pointer-events: none; }

        /* Giant Status Text so we know if it breaks */
        #status-text { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; z-index: 200; font-weight: bold; font-size: 18px; color: yellow; text-shadow: 2px 2px 4px #000; pointer-events: none;}

        #menu { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 100; background: rgba(0,0,0,0.8); padding: 30px; 
            border: 3px solid #0f8; border-radius: 20px; text-align: center; width: 80%; max-width: 320px;
        }

        .hp-layer { position: absolute; top: 40px; width: 100%; display: none; justify-content: space-around; z-index: 50; }
        .hp-bar { width: 40%; height: 25px; border: 2px solid #fff; border-radius: 12px; background: #333; overflow: hidden; }
        .hp-fill { height: 100%; width: 100%; transition: width 0.1s; }

        button { background: #0f8; color: #000; border: none; padding: 18px; font-weight: bold; border-radius: 10px; width: 100%; font-size: 20px; margin-top: 10px; }
        input { width: 90%; padding: 15px; background: #111; color: #0f8; border: 1px solid #0f8; font-size: 24px; text-align: center; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="status-text">STATUS: WAITING FOR YOU TO PRESS START</div>

    <video id="video-feed" playsinline autoplay muted></video>
    <canvas id="game-canvas"></canvas>

    <div id="menu">
        <h2 style="margin:0; color:#0f8;">HAND FIGHTER</h2>
        <div id="step1">
            <button onclick="forceStartCamera()">1. START CAMERA</button>
        </div>
        <div id="step2" style="display:none">
            <p>YOUR ID: <b id="my-id" style="font-size: 30px;">...</b></p>
            <input type="number" id="join-id" placeholder="ENEMY ID">
            <button onclick="startConnection()">2. FIGHT!</button>
        </div>
    </div>

    <div class="hp-layer" id="hp-ui">
        <div class="hp-bar"><div id="my-hp" class="hp-fill" style="background:#0f8"></div></div>
        <div class="hp-bar"><div id="enemy-hp" class="hp-fill" style="background:#f30"></div></div>
    </div>

    <script type="module">
        const status = document.getElementById('status-text');
        
        // 1. Direct Camera Boot (Bypasses AI completely so you see yourself instantly)
        const videoElement = document.getElementById('video-feed');
        
        window.forceStartCamera = async () => {
            status.innerText = "STATUS: ASKING FOR CAMERA PERMISSION...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                videoElement.srcObject = stream;
                
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                status.innerText = "STATUS: CAMERA ON! WAITING TO CONNECT...";
                
                // Now that camera is safely on, wake up the AI
                startAI();
            } catch (error) {
                status.innerText = "ERROR: IPAD BLOCKED CAMERA!";
                alert("Camera blocked! Go to Settings > Safari > Camera and set to 'Allow'");
            }
        };

        // 2. Peer-to-Peer Connection
        const myShortId = Math.floor(1000 + Math.random() * 8999).toString();
        const peer = new Peer(myShortId, { config: { 'iceServers': [{ url: 'stun:stun.l.google.com:19302' }] } });
        let connection = null;
        let myHP = 100, enemyPos = {x:-500, y:-500};

        peer.on('open', id => document.getElementById('my-id').innerText = id);

        peer.on('connection', conn => { connection = conn; activateGame(); });
        window.startConnection = () => { connection = peer.connect(document.getElementById('join-id').value); activateGame(); };

        function activateGame() {
            connection.on('open', () => {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('hp-ui').style.display = 'flex';
                status.innerText = ""; // Clear status when game starts
            });
            connection.on('data', data => {
                if(data.type === 'pos') enemyPos = data.val;
                if(data.type === 'hit') {
                    myHP -= 5;
                    document.getElementById('my-hp').style.width = myHP + "%";
                    if(myHP <= 0) { alert("YOU WERE DEFEATED!"); location.reload(); }
                }
            });
        }

        // 3. Independent Hand AI (If this breaks, camera still works!)
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function drawCharacter(x, y, color, label) {
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI*2); ctx.fill();
            // Visor
            ctx.fillStyle = "black"; ctx.fillRect(x-25, y-10, 50, 15);
            // Label
            ctx.fillStyle = "white"; ctx.font = "bold 20px Arial";
            ctx.textAlign = "center"; ctx.fillText(label, x, y - 55);
        }

        function startAI() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            
            hands.onResults(results => {
                canvas.width = videoElement.videoWidth;
                canvas.height = videoElement.videoHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (results.multiHandLandmarks && results.multiHandLandmarks[0]) {
                    const wrist = results.multiHandLandmarks[0][0];
                    // Because we flipped the CSS, we use raw coordinates
                    const myX = wrist.x * canvas.width;
                    const myY = wrist.y * canvas.height;
                    
                    if(connection && connection.open) {
                        connection.send({type: 'pos', val: {x: myX, y: myY}});
                        let dist = Math.sqrt((myX - enemyPos.x)**2 + (myY - enemyPos.y)**2);
                        if(dist < 70) connection.send({type: 'hit'});
                    }
                    drawCharacter(myX, myY, "#0f8", "YOU");
                }
                
                if(connection && connection.open) {
                    drawCharacter(enemyPos.x, enemyPos.y, "#f30", "ENEMY");
                }
            });

            // Feed the video to the AI manually
            async function feedVideo() {
                if(!videoElement.paused && !videoElement.ended) {
                    await hands.send({image: videoElement});
                }
                requestAnimationFrame(feedVideo);
            }
            feedVideo();
        }
    </script>
</body>
</html>
