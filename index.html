<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike | Master Edition</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <style>
        body { margin: 0; background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace; color: white; touch-action: none;}
        #video-feed { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 1; opacity: 0.4; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 2; pointer-events: none; }
        
        #menu, #pause-overlay, #leaderboard-overlay, #profile-gate { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 100; background: rgba(0,0,0,0.95); padding: 25px; 
            border: 2px solid #0f8; border-radius: 15px; text-align: center; width: 90%; max-width: 400px;
        }

        #pause-overlay, #leaderboard-overlay { display: none; border-color: #f80; }

        .hub-btn { background: #0f8; color: #000; padding: 15px; width: 100%; border: none; font-weight: bold; font-size: 18px; margin-top: 10px; border-radius: 8px; cursor: pointer; }
        .hub-btn.small { padding: 8px; font-size: 14px; background: #444; color: white; }
        
        input { width: 85%; padding: 12px; background: #111; color: #0f8; border: 1px solid #0f8; text-align: center; border-radius: 5px; margin-bottom: 10px;}
        
        #ingame-ui { position: absolute; top: 10px; width: 100%; display: none; justify-content: center; align-items: center; gap: 20px; z-index: 60; }
        .lb-row { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 8px; }
    </style>
</head>
<body>

    <div id="profile-gate">
        <h1 style="color:#0f8;">NEON STRIKE</h1>
        <input type="text" id="username-input" placeholder="CREATE YOUR NAME..." maxlength="12">
        <button class="hub-btn" onclick="saveProfile()">SAVE & PLAY</button>
    </div>

    <div id="ingame-ui">
        <div id="timer" style="font-size:30px; background:rgba(0,0,0,0.6); padding:5px 15px; border-radius:8px; color:#f80;">99</div>
        <button onclick="togglePauseRequest()" style="padding:10px; border-radius: 5px; border:none; background: white; font-weight:bold;">PAUSE</button>
    </div>

    <div id="leaderboard-overlay">
        <h2 style="color:#0f8;">LEADERBOARD</h2>
        <div id="lb-content"></div>
        <button class="hub-btn" onclick="document.getElementById('leaderboard-overlay').style.display='none'">CLOSE</button>
    </div>

    <video id="video-feed" playsinline autoplay muted></video>
    <canvas id="game-canvas"></canvas>

    <div id="menu" style="display:none">
        <p><span id="display-name" style="color:#0f8; font-weight:bold;">Player</span> | Wins: <b id="win-display">0</b></p>
        
        <div id="cam-gate"><button class="hub-btn" onclick="initCam()">1. START CAMERA</button></div>
        
        <div id="hub-gate" style="display:none">
            <button class="hub-btn" onclick="openMode('1v1')">1v1 DUEL (WITH CODE)</button>
            <button class="hub-btn" style="background:#444; color:white;" onclick="openMode('lobby')">MULTIPLAYER LOBBY</button>
            <button class="hub-btn small" onclick="showLeaderboard()">LEADERBOARD</button>
            <p style="font-size:12px;">MY CODE: <b id="my-id" style="color:#0f8">----</b></p>
        </div>

        <div id="lobby-gate" style="display:none">
            <h3 id="mode-header">LOBBY</h3>
            <input type="number" id="join-id" placeholder="ENTER FRIEND'S CODE">
            <button onclick="connectPeer()" style="padding:10px; background:#08f; border:none; color:white; width:80%; font-weight:bold; border-radius:5px;">CONNECT</button>
            <div id="team-ui" style="display:flex; justify-content:space-between; margin:15px 0;">
                <button onclick="switchTeam(1)" style="background:#08f; width:45%; padding:10px; border:none; border-radius:5px;">BLUE</button>
                <button onclick="switchTeam(2)" style="background:#f30; width:45%; padding:10px; border:none; border-radius:5px;">RED</button>
            </div>
            <button id="start-btn" class="hub-btn" onclick="startGame()">START MATCH</button>
        </div>
    </div>

    <script type="module">
        const video = document.getElementById('video-feed');
        let myTeam = 1, myHP = 100, mode = 'lobby', myName = "";
        let players = {}, conns = {}, isGaming = false, isHost = true;
        let myWins = parseInt(localStorage.getItem('neonWins')) || 0;

        window.onload = () => {
            const savedName = localStorage.getItem('neonName');
            if(savedName) {
                myName = savedName;
                document.getElementById('profile-gate').style.display = 'none';
                document.getElementById('menu').style.display = 'block';
                document.getElementById('display-name').innerText = myName;
                document.getElementById('win-display').innerText = myWins;
            }
        };

        window.saveProfile = () => {
            const input = document.getElementById('username-input').value.trim();
            if(input.length < 2) return alert("Name too short!");
            myName = input;
            localStorage.setItem('neonName', myName);
            document.getElementById('profile-gate').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            document.getElementById('display-name').innerText = myName;
        };

        window.initCam = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            document.getElementById('cam-gate').style.display = 'none';
            document.getElementById('hub-gate').style.display = 'block';
            startAI();
        };

        const myId = Math.floor(1000 + Math.random() * 8999).toString();
        const peer = new Peer(myId);
        peer.on('open', id => document.getElementById('my-id').innerText = id);
        peer.on('connection', c => { isHost = true; handleConn(c); });

        window.openMode = (m) => {
            mode = m; 
            document.getElementById('hub-gate').style.display = 'none';
            document.getElementById('lobby-gate').style.display = 'block';
            document.getElementById('mode-header').innerText = m === '1v1' ? '1v1 DUEL' : 'MULTIPLAYER LOBBY';
            document.getElementById('team-ui').style.display = m === '1v1' ? 'none' : 'flex';
        };

        window.connectPeer = () => {
            isHost = false; 
            const targetId = document.getElementById('join-id').value;
            if(targetId) handleConn(peer.connect(targetId));
        };

        function handleConn(c) {
            c.on('open', () => {
                conns[c.peer] = c;
                if(mode === '1v1') { myTeam = 1; broadcast({type:'force-team', team: 2}); }
                c.on('data', data => {
                    if(data.type === 'sync') { players[c.peer] = data; checkWinCondition(); }
                    if(data.type === 'force-team') { myTeam = data.team; }
                    if(data.type === 'hit' && data.target === myId) { myHP -= 5; if(myHP < 0) myHP = 0; }
                    if(data.type === 'start') {
                        isGaming = true;
                        document.getElementById('menu').style.display = 'none';
                        document.getElementById('ingame-ui').style.display = 'flex';
                    }
                });
            });
        }

        window.startGame = () => {
            isGaming = true;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ingame-ui').style.display = 'flex';
            broadcast({type: 'start'});
        };

        const sync = (pos = []) => broadcast({type: 'sync', name: myName, team: myTeam, hp: myHP, pos: pos, wins: myWins});
        function broadcast(d) { Object.values(conns).forEach(c => { if(c.open) c.send(d); }); }

        const canvas = document.getElementById('game-canvas'), ctx = canvas.getContext('2d');

        function startAI() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });
            hands.onResults(res => {
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                ctx.clearRect(0,0, canvas.width, canvas.height);
                let myPos = [];
                if(res.multiHandLandmarks) {
                    res.multiHandLandmarks.forEach(h => {
                        const x = h[0].x * canvas.width, y = h[0].y * canvas.height;
                        myPos.push({x, y});
                        if(isGaming && myHP > 0) {
                            drawChar(x, y, myTeam, myName, myHP);
                            Object.keys(players).forEach(id => {
                                const p = players[id];
                                if(p.team !== myTeam && p.hp > 0) {
                                    p.pos.forEach(ep => {
                                        if(Math.sqrt((x-ep.x)**2 + (y-ep.y)**2) < 60) broadcast({type: 'hit', target: id});
                                    });
                                }
                            });
                        }
                    });
                }
                if(isGaming || Object.keys(conns).length > 0) {
                    Object.values(players).forEach(p => {
                        if(p.hp > 0) p.pos.forEach(pos => drawChar(pos.x, pos.y, p.team, p.name, p.hp));
                    });
                    sync(myPos);
                }
            });
            async function loop() { if(video.readyState >= 2) await hands.send({image: video}); requestAnimationFrame(loop); }
            loop();
        }

        function drawChar(x, y, team, name, hp) {
            const c = team === 1 ? "#08f" : "#f30";
            ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.fillText(name, x, y-60);
            ctx.fillStyle = "#333"; ctx.fillRect(x-30, y-55, 60, 6);
            ctx.fillStyle = c; ctx.fillRect(x-30, y-55, 60 * (hp/100), 6);
        }

        function checkWinCondition() {
            if(!isGaming) return;
            const teamsAlive = new Set();
            if(myHP > 0) teamsAlive.add(myTeam);
            Object.values(players).forEach(p => { if(p.hp > 0) teamsAlive.add(p.team); });
            if(teamsAlive.size === 1) {
                const winnerTeam = Array.from(teamsAlive)[0];
                isGaming = false;
                if(winnerTeam === myTeam) {
                    myWins++; localStorage.setItem('neonWins', myWins);
                    alert("VICTORY!");
                } else { alert("DEFEAT!"); }
                location.reload();
            }
        }
    </script>
</body>
</html>
