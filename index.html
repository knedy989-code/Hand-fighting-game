<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Hand Fight</title>
    
    <!-- Using older, more stable versions of libraries for better mobile support -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <style>
        body { margin: 0; background: #000; color: #0f8; font-family: sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        
        #menu-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100; display: flex; 
            flex-direction: column; align-items: center; justify-content: center;
        }

        .box { background: #111; border: 3px solid #0f8; padding: 25px; border-radius: 20px; width: 280px; text-align: center; }
        
        .hp-layer { position: absolute; top: 20px; width: 100%; display: none; justify-content: space-around; z-index: 50; }
        .hp-bar { width: 42%; height: 20px; border: 2px solid #fff; border-radius: 10px; background: #333; overflow: hidden; }
        .hp-fill { height: 100%; width: 100%; transition: width 0.1s; }

        button { background: #0f8; color: #000; border: none; padding: 15px; font-weight: bold; border-radius: 10px; width: 100%; font-size: 18px; margin-top: 10px; }
        input { width: 85%; padding: 12px; background: #000; color: #0f8; border: 1px solid #0f8; font-size: 20px; text-align: center; border-radius: 8px; }
        
        canvas { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <div class="box" id="start-box">
            <h2 style="margin:0">HAND FIGHTER</h2>
            <p style="font-size:12px; color:#aaa;">Works on Safari & Google App</p>
            <button onclick="startEverything()">TAP TO START</button>
        </div>
        
        <div class="box" id="connect-box" style="display:none">
            <p>YOUR ID: <b id="my-id-text" style="font-size:25px; color:#fff">....</b></p>
            <input type="number" id="target-id" placeholder="OPPONENT ID">
            <button onclick="connectFighters()">JOIN BATTLE</button>
        </div>
    </div>

    <div class="hp-layer" id="ui">
        <div class="hp-bar"><div id="my-hp" class="hp-fill" style="background:#0f8"></div></div>
        <div class="hp-bar"><div id="enemy-hp" class="hp-fill" style="background:#f30"></div></div>
    </div>

    <!-- Safari needs muted and playsinline to show video -->
    <video id="v" style="display:none" playsinline muted autoplay></video>
    <canvas id="c"></canvas>

    <script type="module">
        const myId = Math.floor(1000 + Math.random() * 8999).toString();
        const peer = new Peer(myId, { 
            config: { 'iceServers': [{ url: 'stun:stun.l.google.com:19302' }] } 
        });

        let connection = null;
        let myHP = 100, enemyPos = {x:-1000, y:-1000};

        peer.on('open', id => document.getElementById('my-id-text').innerText = id);

        // This function wakes up the camera and PeerJS at the same time
        window.startEverything = async () => {
            document.getElementById('start-box').style.display = 'none';
            document.getElementById('connect-box').style.display = 'block';
            
            try {
                await camera.start();
            } catch (e) {
                alert("Please Allow Camera Access in your Settings!");
            }
        };

        peer.on('connection', conn => { 
            connection = conn; 
            bindEvents(); 
        });

        window.connectFighters = () => {
            const id = document.getElementById('target-id').value;
            connection = peer.connect(id, { reliable: false });
            bindEvents();
        };

        function bindEvents() {
            connection.on('open', () => {
                document.getElementById('menu-overlay').style.display = 'none';
                document.getElementById('ui').style.display = 'flex';
            });
            connection.on('data', d => {
                if(d.t === 'p') enemyPos = d.v;
                if(d.t === 'h') {
                    myHP -= 5;
                    document.getElementById('my-hp').style.width = myHP + "%";
                    if(myHP <= 0) { alert("GAME OVER!"); location.reload(); }
                }
            });
        }

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        function drawHero(x, y, color, label) {
            ctx.shadowBlur = 15; ctx.shadowColor = color;
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI*2); ctx.fill();
            // Character Visor
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(x-25, y-8, 50, 15);
            // Label
            ctx.shadowBlur = 0; ctx.fillStyle = "#fff"; ctx.font = "bold 16px Arial";
            ctx.textAlign = "center"; ctx.fillText(label, x, y - 55);
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        hands.onResults(r => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Background
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,canvas.width, canvas.height);

            // Camera Feed (Translucent)
            ctx.save();
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.globalAlpha = 0.35;
            if(r.image) ctx.drawImage(r.image, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            if (r.multiHandLandmarks && r.multiHandLandmarks[0]) {
                const pt = r.multiHandLandmarks[0][0];
                const x = (1 - pt.x) * canvas.width;
                const y = pt.y * canvas.height;
                
                if(connection && connection.open) {
                    connection.send({t: 'p', v: {x: x, y: y}});
                    let dist = Math.sqrt((x - enemyPos.x)**2 + (y - enemyPos.y)**2);
                    if(dist < 75) connection.send({t: 'h'});
                }
                drawHero(x, y, "#0f8", "YOU");
            }
            
            if(connection && connection.open) {
                drawHero(enemyPos.x, enemyPos.y, "#f30", "ENEMY");
            }
        });

        const camera = new Camera(document.getElementById('v'), {
            onFrame: async () => { await hands.send({image: document.getElementById('v')}); },
            width: 640, height: 480
        });
    </script>
</body>
</html>
